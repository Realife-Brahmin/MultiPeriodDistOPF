name: Repository checks
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  structure-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintained navigation and Python syntax
        run: python tools/check_repository.py
      - name: Test standalone OpenDSS network packaging (no simulations)
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.4'
      - name: Parse active SPAR-DDP Julia sources (no solves or package installation)
        run: julia --startup-file=no tools/check_julia_syntax.jl
